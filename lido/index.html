<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lido Labs — GOOSE-4 &amp; 2027 EGG Accountability Board (Powered by Wisp Enclave)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --bg-elevated: #ffffff;
    --bg-subtle: #ede8dd;
    --ink: #171816;
    --ink-secondary: #4a4c46;
    --ink-muted: #767870;
    --accent: #0088cc;
    --wisp: #1f5f4a;
    --wisp-bg: #eaf5f0;
    --wisp-border: #b6dccb;
    --amber: #9e5a16;
    --amber-bg: #fdf5ea;
    --amber-border: #ebcfab;
    --danger: #a62c22;
    --danger-bg: #fdf2f1;
    --danger-border: #edc3be;
    --ok: #255c3e;
    --ok-bg: #eef7f1;
    --ok-border: #bcdcc8;
    --border: #dcd6c8;
    --border-strong: #c5beae;
    --radius-sm: 6px;
    --radius-md: 9px;
    --radius-lg: 11px;
    --shadow-sm: 0 1px 2px rgba(23, 24, 22, 0.04);
    --shadow-lg: 0 18px 40px rgba(23, 24, 22, 0.16);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--ink);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Row 1: Top Header Bar */
  .topbar {
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: 9px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    white-space: nowrap;
  }

  .brand-left {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .brand-mark {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffffff;
    background: var(--accent);
    padding: 4px 8px;
    border-radius: 4px;
  }

  .sprint-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2.5px 8px;
    border-radius: 4px;
  }

  .meta-pill strong {
    color: var(--ink);
    font-weight: 600;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .view-toggle {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 2px;
  }

  .view-btn {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-secondary);
    padding: 4px 9px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .view-btn.active {
    background: var(--bg-elevated);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  .btn {
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg-elevated);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.12s ease;
    white-space: nowrap;
    text-decoration: none;
  }

  .btn:hover {
    background: var(--bg-subtle);
  }

  .btn-wisp {
    background: var(--wisp-bg);
    color: var(--wisp);
    border-color: var(--wisp-border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  .btn-wisp:hover {
    background: #dcf0e7;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--bg-elevated);
    border-color: var(--ink);
  }

  .btn-primary:hover {
    background: #2c2e2a;
  }

  /* Row 2: Single-Glance Pace & Wisp Enclave Status Bar */
  .pace-bar {
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    padding: 7px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    white-space: nowrap;
  }

  .pace-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pace-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--amber-bg);
    color: var(--amber);
    border: 1px solid var(--amber-border);
  }

  .pace-status.on-track {
    background: var(--ok-bg);
    color: var(--ok);
    border-color: var(--ok-border);
  }

  .pace-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .kpi-chip {
    font-size: 11px;
    color: var(--ink-secondary);
    padding-left: 10px;
    border-left: 1px solid var(--border-strong);
  }

  .kpi-chip strong {
    color: var(--ink);
    font-weight: 600;
  }

  .wisp-enclave-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--wisp);
    background: var(--wisp-bg);
    border: 1px solid var(--wisp-border);
    padding: 2.5px 9px;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .wisp-enclave-pill:hover {
    background: #dcf0e7;
  }

  /* Board Container */
  .board-container {
    padding: 10px 20px 14px;
    flex: 1;
    overflow-x: auto;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(290px, 1fr));
    gap: 12px;
    align-items: start;
  }

  .board-col {
    background: rgba(237, 232, 221, 0.55);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 9px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .board-col.active-col {
    background: rgba(253, 245, 234, 0.5);
    border-color: var(--amber-border);
  }

  .col-header {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 1px 2px 6px;
    border-bottom: 1px solid var(--border);
  }

  .board-col.active-col .col-header {
    border-bottom-color: var(--amber-border);
  }

  .col-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .col-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .col-pace-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    padding: 1.5px 6px;
    border-radius: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--ink-secondary);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .col-pace-tag.done {
    background: var(--ok-bg);
    border-color: var(--ok-border);
    color: var(--ok);
  }

  .col-pace-tag.warn {
    background: var(--amber-bg);
    border-color: var(--amber-border);
    color: var(--amber);
  }

  .col-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
  }

  .col-cards {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Clean 2-to-3 Row Card Structure (Identical density to ScribeUp) */
  .task-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 7.5px 10px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .task-card:hover {
    transform: translateY(-1px);
    border-color: var(--border-strong);
  }

  .task-card.blocker-card {
    border-left: 3px solid var(--danger);
  }

  .task-card.scope-card {
    border-left: 3px solid var(--amber);
  }

  .task-card.pace-card {
    border-left: 3px solid var(--ok);
  }

  .task-card.done-card {
    opacity: 0.82;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .card-id-owner {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-muted);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .card-id-owner strong {
    color: var(--ink-secondary);
  }

  .wisp-tag {
    color: var(--wisp);
    font-weight: 600;
  }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge-ok {
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok-border);
  }

  .badge-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid var(--danger-border);
  }

  .badge-warn {
    background: var(--amber-bg);
    color: var(--amber);
    border: 1px solid var(--amber-border);
  }

  .badge-neutral {
    background: var(--bg-subtle);
    color: var(--ink-secondary);
    border: 1px solid var(--border);
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.28;
  }

  .card-note {
    font-size: 11px;
    color: var(--ink-secondary);
    line-height: 1.32;
  }

  .blocker-reason {
    font-size: 10.8px;
    color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    padding: 4px 7px;
    border-radius: 4px;
    line-height: 1.3;
    font-weight: 500;
  }

  .scope-reason {
    font-size: 10.8px;
    color: var(--amber);
    background: var(--amber-bg);
    border: 1px solid var(--amber-border);
    padding: 4px 7px;
    border-radius: 4px;
    line-height: 1.3;
    font-weight: 500;
  }

  /* Table View (Wisp AI Ops Workflows) */
  .table-view {
    display: none;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .filter-bar {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    font-size: 11px;
    color: var(--ink-muted);
  }

  .link-pill {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    padding: 3px 9px;
    border-radius: 999px;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .link-pill.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .pm-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
  }

  .pm-table th {
    background: var(--bg-subtle);
    text-align: left;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-secondary);
    border-bottom: 1px solid var(--border);
  }

  .pm-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--ink);
    vertical-align: top;
  }

  .pm-table tbody tr {
    cursor: pointer;
    transition: background 0.12s ease;
  }

  .pm-table tbody tr:hover {
    background: var(--bg);
  }

  .pm-table tr.row-blocker {
    background: #fff8f7;
  }

  /* Modal & Form */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(23, 24, 22, 0.45);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-sheet {
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    max-width: 650px;
    width: 100%;
    max-height: 86vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .modal-title {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
  }

  .modal-close {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink-secondary);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .modal-body {
    font-size: 12.5px;
    color: var(--ink-secondary);
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .kv {
    display: grid;
    grid-template-columns: 145px 1fr;
    gap: 7px 12px;
    font-size: 12px;
    align-items: start;
  }

  .kv b {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding-top: 2px;
  }

  .wisp-signal-box {
    background: var(--wisp-bg);
    border: 1px solid var(--wisp-border);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--wisp);
    line-height: 1.4;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-field.full {
    grid-column: 1 / -1;
  }

  .form-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }

  .form-field input,
  .form-field select,
  .form-field textarea {
    font-family: inherit;
    font-size: 12px;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }

  .form-field textarea {
    min-height: 56px;
    resize: vertical;
  }

  .draft-box {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.2px;
    color: var(--ink);
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: var(--ink);
    color: var(--bg-elevated);
    padding: 9px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    transform: translateY(70px);
    opacity: 0;
    transition: all 0.2s ease;
    z-index: 200;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-left">
    <span class="brand-mark">LIDO LABS</span>
    <div class="sprint-title">
      <span>GOOSE-4 &amp; EGG Accountability Board</span>
      <span class="meta-pill"><strong>$60M EGG · 4 P&amp;L Lines</strong> · Forum Lock <strong>Nov 23</strong></span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="view-toggle">
      <button class="view-btn active" id="btn-view-board" onclick="switchView('board')">Board</button>
      <button class="view-btn" id="btn-view-table" onclick="switchView('table')">Wisp Automations (6)</button>

    <button class="btn btn-wisp" onclick="openWispSyncModal()">Wisp Sync ↻</button>
    <button class="btn" onclick="openNewCardModal()">+ Gate</button>

</header>

<section class="pace-bar">
  <div class="pace-left">
    <span class="pace-status" id="pace-badge"><span class="pace-dot"></span><span id="pace-badge-text">AT RISK</span></span>
    <span class="kpi-chip" id="kpi-progress"></span>
    <span class="kpi-chip"><strong>27 Days to Nov 23 Lock</strong> · Dec 7 Vote</span>

  </button>
</section>

<main class="board-container">
  <div class="board-grid" id="board-grid"></div>

  <div class="table-view" id="table-view">
    <div class="filter-bar" id="filter-bar"></div>
    <table class="pm-table">
      <thead>
        <tr>
          <th>Wisp Enclave Automation</th>
          <th>P&amp;L Line</th>
          <th>Connected MCPs</th>
          <th>Cadence</th>
          <th>What It Replaces in Operations Unit</th>
          <th>Owner</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</main>

<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>
<div class="toast" id="toast"></div>

  ['Cross-Unit Dependency Radar', 'Staking (Core)', 'Linear · Slack / Forum', 'Bi-weekly', 'Surfaces unowned handoffs between Protocol R&D, Legal, and Validator Ops without adding meetings', 'Strategic PM', 'On Pace', 'KR-03'],
  ['BORG Multisig & Signer SLA Check', 'Shared Services · BORG', 'Notion · Safe Config', 'Monthly', 'Verifies signer rotation steps, Etherscan signatures, and Cayman foundation compliance dates', 'BORG Ops', 'Done', 'KR-11'],
  ['Vendor & Contract Renewal Triage', 'Shared Services · BORG', 'Notion · Local Docs', 'Monthly', 'Reviews contributor/vendor renewal terms inside Wisp private enclave with zero external data retention', 'Legal + Ops', 'On Pace', 'KR-08']
];

let filter = 'All';
const $ = i => document.getElementById(i);

function toast(m) {
  const t = $('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function fmtDate(iso) {
  if (!iso) return 'Nov 23';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function badge(c) {
  const dt = fmtDate(c.due);
  if (c.st === 'done') return `<span class="badge badge-ok">Locked · ${dt}</span>`;
  if (c.st === 'blocker') return `<span class="badge badge-danger">BLOCKER · ${dt}</span>`;
  if (c.st === 'scope') return `<span class="badge badge-warn">DUE ${dt.toUpperCase()}</span>`;
  if (c.st === 'pace') return `<span class="badge badge-ok">ON PACE · ${dt}</span>`;
  return `<span class="badge badge-neutral">${dt}</span>`;
}

function render() {
  const g = $('board-grid');
  g.innerHTML = '';
  const allFlagged = cards.filter(c => c.st === 'blocker' || c.st === 'scope');

  stages.forEach((s, i) => {
    const cs = cards.filter(c => c.s === i);
    const colFlagged = cs.filter(c => c.st === 'blocker' || c.st === 'scope');
    let tag = s.tag, cls = 'done';
    if (s.tag === 'active' || colFlagged.length) {
      tag = colFlagged.length ? `Active · ${colFlagged.length} Flagged` : 'On Pace ✓';
      cls = colFlagged.length ? 'warn' : 'done';
    }
    const col = document.createElement('div');
    col.className = 'board-col' + (colFlagged.length ? ' active-col' : '');
    col.innerHTML = `
      <div class="col-header">
        <div class="col-header-top">
          <span class="col-title">${s.n}</span>
          <span class="col-pace-tag ${cls}">${tag}</span>
        </div>
        <div class="col-subtitle">
          <span>${s.d}</span>
          <span>${cs.filter(c => c.st === 'done').length}/${cs.length} locked</span>
        </div>
      </div>
      <div class="col-cards">
        ${cs.map(c => `
          <div class="task-card ${c.st === 'blocker' ? 'blocker-card' : c.st === 'scope' ? 'scope-card' : c.st === 'pace' ? 'pace-card' : c.st === 'done' ? 'done-card' : ''}" onclick="openCard('${c.id}')">
            <div class="card-top">
              <span class="card-id-owner"><strong>${c.id}</strong> · ${c.tranche} · <span class="wisp-tag">Wisp: ${c.mcp}</span></span>
              ${badge(c)}
            </div>
            <div class="card-title">${c.t}</div>
            ${c.n && c.st !== 'done' ? (c.st === 'blocker' ? `<div class="blocker-reason">${c.n}</div>` : c.st === 'scope' ? `<div class="scope-reason">${c.n}</div>` : `<div class="card-note">${c.n}</div>`) : ''}
          </div>
        `).join('')}
      </div>
    `;
    g.appendChild(col);
  });

  const done = cards.filter(c => c.st === 'done').length;
  $('kpi-progress').innerHTML = `<strong>${done}/${cards.length} Locked</strong> · ${allFlagged.length} Flagged`;
  const b = $('pace-badge');
  b.classList.toggle('on-track', !allFlagged.length);
  $('pace-badge-text').textContent = allFlagged.length ? 'AT RISK' : 'ON TRACK';

  const bl = [];
  if (cards[3].st === 'blocker') bl.push('Earn Growth Rubric (KR-04)');
  if (cards[9].st === 'scope') bl.push('GOOSE-4 / EGG Lock (KR-10)');
  $('kpi-bottleneck').innerHTML = bl.length ? `<strong>Waiting on:</strong> ${bl.join(' & ')}` : `<strong>Blockers:</strong> None`;

  renderTable();
}

function renderTable() {
  $('filter-bar').innerHTML = 'Filter:' + ['All', 'Flagged', 'Blocked', 'On Pace', 'Done'].map(f => `<button class="link-pill ${f === filter ? 'active' : ''}" onclick="filter='${f}';renderTable()">${f}</button>`).join('') + '<span style="margin-left:auto">Dogfooding Wisp (usewisp.io) across Lido Labs Operations · Zero cloud LLM retention</span>';
  const cls = { Blocked: 'badge-danger', Flagged: 'badge-warn', 'On Pace': 'badge-ok', Done: 'badge-neutral' };
  $('table-body').innerHTML = workflows.filter(r => filter === 'All' || r[6] === filter).map(r => `
    <tr class="${r[6] === 'Blocked' ? 'row-blocker' : ''}" onclick="openCard('${r[7]}')">
      <td><strong>${r[0]}</strong></td>
      <td>${r[1]}</td>
      <td><span style="font-family:'JetBrains Mono',monospace;font-size:11px;">${r[2]}</span></td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
      <td><span class="badge ${cls[r[6]]}">${r[6]}</span></td>
    </tr>
  `).join('');
}

function switchView(v) {
  $('board-grid').style.display = v === 'board' ? 'grid' : 'none';
  $('table-view').style.display = v === 'table' ? 'block' : 'none';
  $('btn-view-board').classList.toggle('active', v === 'board');
  $('btn-view-table').classList.toggle('active', v === 'table');
}

function modal(title, sub, body, actions = '') {
  $('modal-sheet').innerHTML = `
    <div class="modal-header">
      <div>
        <div class="card-id-owner">${sub}</div>
        <h2 class="modal-title">${title}</h2>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Close</button>
      ${actions}
    </div>
  `;
  $('modal-backdrop').classList.add('open');
}

function closeModal() {
  $('modal-backdrop').classList.remove('open');
}

function openCard(id) {
  const c = cards.find(x => x.id === id);
  modal(
    c.t,
    `${c.id} · ${stages[c.s].n}`,
    `<div class="kv">
      <b>Owner</b><span>${c.o}</span>
      <b>Status</b><span>${badge(c)}</span>
      <b>EGG Budget Pool</b><span>${c.tranche}</span>
      <b>Due Date</b><span><input type="date" style="font-family:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bg);" value="${c.due}" onchange="updateDue('${c.id}', this.value)" /></span>
      <b>Wisp Enclave Signal</b><div class="wisp-signal-box">${c.wisp}</div>
      <b>Operational Context</b><span>${c.d || c.n}</span>
    </div>`,
    c.st === 'done' ? '' : `<button class="btn btn-primary" onclick="resolve('${c.id}')">Mark Gate Locked ✓</button>`
  );
}

function saveNewCard() {
  const title = ($('new-title').value || '').trim() || 'New Milestone Gate';
  const stageIdx = parseInt($('new-stage').value, 10) || 0;
  const tranche = $('new-tranche').value || 'Growth EGG ($13.9M)';
  const mcp = $('new-mcp').value || 'Notion MCP';
  const due = $('new-due').value || '2026-11-18';
  const st = $('new-status').value;
  const note = ($('new-note').value || '').trim();
  const id = 'KR-' + String(cards.length + 1).padStart(2, '0');

  cards.push({
    id, s: stageIdx, st, t: title, o: 'Operations Unit', tranche, mcp, due,
    wisp: `${mcp}: ${note || 'Tracked inside Wisp private enclave for Nov 23 GOOSE-4 lock.'}`,
    n: note || (st !== 'pace' ? `Wisp (${mcp}): Added to GOOSE-4 / 2027 EGG tracking cycle.` : ''),
    d: note || 'Added to GOOSE-4 / 2027 EGG tracking cycle.'
  });
  closeModal();
  switchView('board');
  render();
  toast(id + ' logged via ' + mcp);
}

function resolve(id) {
  const c = cards.find(x => x.id === id);
  c.st = 'done';
  workflows.forEach(w => { if (w[7] === id) w[6] = 'Done'; });
  closeModal();
  render();
  toast(id + ' locked');
}

function openPulse() {
  const open = cards.filter(c => c.st === 'blocker' || c.st === 'scope');
  modal(
    'Tokenholder & Ops Accountability Digest',
    'Compiled inside Wisp Enclave from Linear, Notion & Granola · Zero Cloud LLM Retention',
    `<div class="draft-box">Subject: Lido Labs — GOOSE-4 & 2027 EGG Readiness (27d to Nov 23 Lock)

Status: ${open.length ? 'AT RISK (' + open.length + ' gates flagged by Wisp)' : 'ON TRACK'} for Nov 23 forum publication → Dec 7 Snapshot vote.

Locked (${cards.filter(c => c.st === 'done').length}/${cards.length} gates verified across $26.9M Core + $13.9M Stage-Gated Growth):
${cards.filter(c => c.st === 'done').map(c => '• ' + c.id + ' [' + c.mcp + ' · ' + c.tranche + '] — ' + c.t).join('\n')}

${open.length ? 'Flagged by Wisp Enclave before Nov 23:\n' + open.map(c => '• ' + c.id + ' [Due ' + fmtDate(c.due) + ' · ' + c.mcp + '] ' + c.t + ' — ' + c.wisp).join('\n') : 'No open blockers.'}</div>`,
    `<button class="btn btn-primary" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.querySelector('.draft-box').innerText);toast('Digest copied');closeModal()">Copy Digest</button>`
  );
}
