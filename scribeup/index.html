<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScribeUp — 30–45 Day FI Launch &amp; Activation Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ec;
    --bg-elevated: #ffffff;
    --bg-subtle: #ede8dd;
    --ink: #171816;
    --ink-secondary: #4a4c46;
    --ink-muted: #767870;
    --accent: #2c4a3e;
    --accent-soft: rgba(44, 74, 62, 0.09);
    --amber: #9e5a16;
    --amber-bg: #fdf5ea;
    --amber-border: #ebcfab;
    --danger: #a62c22;
    --danger-bg: #fdf2f1;
    --danger-border: #edc3be;
    --ok: #255c3e;
    --ok-bg: #eef7f1;
    --ok-border: #bcdcc8;
    --border: #dcd6c8;
    --border-strong: #c5beae;
    --radius-sm: 6px;
    --radius-md: 9px;
    --radius-lg: 11px;
    --shadow-sm: 0 1px 2px rgba(23, 24, 22, 0.04);
    --shadow-lg: 0 18px 40px rgba(23, 24, 22, 0.16);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--ink);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Row 1: Top Header Bar */
  .topbar {
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: 9px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    white-space: nowrap;
  }

  .brand-left {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .brand-mark {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bg-elevated);
    background: var(--ink);
    padding: 4px 8px;
    border-radius: 4px;
  }

  .sprint-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2.5px 8px;
    border-radius: 4px;
  }

  .meta-pill strong {
    color: var(--ink);
    font-weight: 600;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* View Switcher (Board vs Table) */
  .view-toggle {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 2px;
  }

  .view-btn {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-secondary);
    padding: 4px 9px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .view-btn.active {
    background: var(--bg-elevated);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  .btn {
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg-elevated);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.12s ease;
    white-space: nowrap;
    text-decoration: none;
  }

  .btn:hover {
    background: var(--bg-subtle);
  }

  .btn-primary {
    background: var(--ink);
    color: var(--bg-elevated);
    border-color: var(--ink);
  }

  .btn-primary:hover {
    background: #2c2e2a;
  }

  /* Row 2: Single-Glance Pace, Buffer & Reference Links */
  .pace-bar {
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    padding: 7px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    white-space: nowrap;
  }

  .pace-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pace-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--amber-bg);
    color: var(--amber);
    border: 1px solid var(--amber-border);
  }

  .pace-status.on-track {
    background: var(--ok-bg);
    color: var(--ok);
    border-color: var(--ok-border);
  }

  .pace-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .kpi-chip {
    font-size: 11px;
    color: var(--ink-secondary);
    padding-left: 10px;
    border-left: 1px solid var(--border-strong);
  }
  .kpi-chip strong {
    color: var(--ink);
    font-weight: 600;
  }

  .pace-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--ink-secondary);
  }

  .link-pill {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    padding: 3px 9px;
    border-radius: 999px;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .link-pill:hover {
    border-color: var(--ink);
  }

  /* Board Container */
  .board-container {
    padding: 10px 20px 14px;
    flex: 1;
    overflow-x: auto;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(290px, 1fr));
    gap: 12px;
    align-items: start;
  }

  .board-col {
    background: rgba(237, 232, 221, 0.55);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 9px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .board-col.active-col {
    background: rgba(253, 245, 234, 0.5);
    border-color: var(--amber-border);
  }

  .col-header {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 1px 2px 6px;
    border-bottom: 1px solid var(--border);
  }

  .board-col.active-col .col-header {
    border-bottom-color: var(--amber-border);
  }

  .col-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .col-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .col-pace-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    padding: 1.5px 6px;
    border-radius: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--ink-secondary);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .col-pace-tag.done {
    background: var(--ok-bg);
    border-color: var(--ok-border);
    color: var(--ok);
  }

  .col-pace-tag.warn {
    background: var(--amber-bg);
    border-color: var(--amber-border);
    color: var(--amber);
  }

  .col-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
  }

  .col-cards {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Clean 3-Row Card Structure */
  .task-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 7.5px 10px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .task-card:hover {
    transform: translateY(-1px);
    border-color: var(--border-strong);
  }

  .task-card.blocker-card {
    border-left: 3px solid var(--danger);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .card-id-owner {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-muted);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .card-id-owner strong {
    color: var(--ink-secondary);
  }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge-ok {
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok-border);
  }

  .badge-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid var(--danger-border);
  }

  .badge-neutral {
    background: var(--bg-subtle);
    color: var(--ink-secondary);
    border: 1px solid var(--border);
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.28;
  }

  .card-note {
    font-size: 11px;
    color: var(--ink-secondary);
    line-height: 1.32;
  }

  .blocker-reason {
    font-size: 10.8px;
    color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    padding: 4px 7px;
    border-radius: 4px;
    line-height: 1.3;
    font-weight: 500;
  }

  .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    margin-top: 2px;
  }

  .card-btn {
    flex: 1;
    font-family: inherit;
    font-size: 10px;
    font-weight: 600;
    padding: 4px 7px;
    border-radius: 4px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg-elevated);
    cursor: pointer;
    transition: all 0.12s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .card-btn:hover {
    background: #2c2e2a;
  }

  .card-btn.sent-state {
    background: var(--ok-bg);
    color: var(--ok);
    border-color: var(--ok-border);
  }

  .card-btn.secondary {
    flex: 0 0 auto;
    background: var(--bg-subtle);
    color: var(--ink-secondary);
    border-color: var(--border);
  }

  .card-btn.secondary:hover {
    background: var(--ok);
    color: #fff;
    border-color: var(--ok);
  }

  /* Schedule / RAID Table View */
  .table-view {
    display: none;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .pm-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
  }

  .pm-table th {
    background: var(--bg-subtle);
    text-align: left;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-secondary);
    border-bottom: 1px solid var(--border);
  }

  .pm-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--ink);
  }

  .pm-table tr.row-blocker {
    background: #fff8f7;
  }

  /* Form controls inside modals */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }

  .form-field input,
  .form-field select,
  .form-field textarea {
    font-family: inherit;
    font-size: 12px;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--ink);
  }

  .channel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    font-size: 11.5px;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(23, 24, 22, 0.45);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-sheet {
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    max-width: 650px;
    width: 100%;
    max-height: 86vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .modal-title {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
  }

  .modal-close {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink-secondary);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .draft-box {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink);
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .row-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 12.5px;
  }

  .toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: var(--ink);
    color: var(--bg-elevated);
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    transform: translateY(70px);
    opacity: 0;
    transition: all 0.2s ease;
    z-index: 200;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }
  .brand-mark{background:#4F46E5}
  .task-card.scope-card{border-left:3px solid var(--amber)}
  .task-card.pace-card{border-left:3px solid var(--ok)}
  .task-card.done-card{opacity:.82}
  .badge-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
  .scope-reason{font-size:10.8px;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);padding:4px 7px;border-radius:4px;line-height:1.3;font-weight:500}
  .filter-bar{display:flex;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--bg);font-size:11px;color:var(--ink-muted)}
  .filter-bar .link-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .modal-body{font-size:12.5px;color:var(--ink-secondary);line-height:1.5;display:flex;flex-direction:column;gap:10px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12px}
  .kv b{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--ink-muted)}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-left">
    <span class="brand-mark">SCRIBEUP</span>
    <div class="sprint-title">
      <span>FI Launch Tracker</span>
      <span class="meta-pill"><strong>Meridian Federal CU</strong> · Q2 · Go-Live <strong>Nov 18</strong></span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="view-toggle">
      <button class="view-btn active" id="btn-view-board" onclick="switchView('board')">Board</button>
      <button class="view-btn" id="btn-view-table" onclick="switchView('table')">All Launches (8)</button>
    </div>
    <button class="btn" onclick="openAdd()">+ Milestone</button>
    <button class="btn btn-primary" onclick="openPulse()">Send Sponsor Pulse ↗</button>
  </div>
</header>
<section class="pace-bar">
  <div class="pace-left">
    <span class="pace-status" id="pace-badge"><span class="pace-dot"></span><span id="pace-badge-text">AT RISK</span></span>
    <span class="kpi-chip" id="kpi-progress"></span>
    <span class="kpi-chip"><strong>Day 25 of 45</strong></span>
    <span class="kpi-chip" id="kpi-bottleneck"></span>
  </div>
</section>
<main class="board-container">
  <div class="board-grid" id="board-grid"></div>
  <div class="table-view" id="table-view">
    <div class="filter-bar" id="filter-bar"></div>
    <table class="pm-table">
      <thead><tr><th>FI Name</th><th>Core Platform</th><th>Stage</th><th>Day X of 45</th><th>Primary Blocker / Next Gate</th><th>Owner</th><th>Status</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</main>
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet" id="modal-sheet"></div></div>
<div class="toast" id="toast"></div>

 ['Cascade Member CU','Lumin Digital','02 · Brand & UAT','18','Vendor risk questionnaire overdue','Compliance','Flagged'],
 ['Heartland Federal CU','Alkami','03 · Staff Pilot','29','Brand assets missing for banner','FI Digital','Blocked'],
 ['Coastal Community Bank','Banno','04 · Go-Live Done','44','Day-45 QBR + CS handover','CS Lead','Done']];
let filter='All';
const $=i=>document.getElementById(i);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function badge(c){if(c.st==='done')return'<span class="badge badge-ok">Done</span>';if(c.st==='blocker')return`<span class="badge badge-danger">${c.b}</span>`;if(c.st==='scope')return`<span class="badge badge-warn">${c.b}</span>`;if(c.st==='pace')return`<span class="badge badge-ok">${c.b}</span>`;return`<span class="badge badge-neutral">${c.b}</span>`}
function render(){
 const g=$('board-grid');g.innerHTML='';
 const flagged=cards.filter(c=>c.st==='blocker'||c.st==='scope');
 stages.forEach((s,i)=>{
  const cs=cards.filter(c=>c.s===i);let tag=s.tag,cls='done';
  if(s.tag==='active'){tag=flagged.length?`Active · ${flagged.length} Flagged`:'Active · Clear';cls=flagged.length?'warn':'done'}
  else if(s.tag==='Scheduled')cls='';
  const col=document.createElement('div');col.className='board-col'+(s.tag==='active'?' active-col':'');
  col.innerHTML=`<div class="col-header"><div class="col-header-top"><span class="col-title">${s.n}</span><span class="col-pace-tag ${cls}">${tag}</span></div><div class="col-subtitle"><span>${s.d}</span><span>${cs.filter(c=>c.st==='done').length}/${cs.length} done</span></div></div><div class="col-cards">${cs.map(c=>`
   <div class="task-card ${c.st==='blocker'?'blocker-card':c.st==='scope'?'scope-card':c.st==='pace'?'pace-card':c.st==='done'?'done-card':''}" onclick="openCard('${c.id}')">
    <div class="card-top"><span class="card-id-owner"><strong>${c.id}</strong> · ${c.o}</span>${badge(c)}</div>
    <div class="card-title">${c.t}</div>
    ${c.n&&c.st!=='done'?(c.st==='blocker'?`<div class="blocker-reason">${c.n}</div>`:c.st==='scope'?`<div class="scope-reason">${c.n}</div>`:`<div class="card-note">${c.n}</div>`):''}
   </div>`).join('')}</div>`;
  g.appendChild(col)});
 const done=cards.filter(c=>c.st==='done').length,pace=cards.filter(c=>c.st==='pace').length+(3-Math.min(3,0));
 $('kpi-progress').innerHTML=`<strong>${done}/${cards.length} Done</strong> · ${flagged.length} Flagged`;
 const b=$('pace-badge');b.classList.toggle('on-track',!flagged.length);$('pace-badge-text').textContent=flagged.length?'AT RISK':'ON TRACK';
 const bl=[];if(cards[6].st==='blocker')bl.push('FI Security Sign-off');if(cards[7].st==='scope')bl.push('Brand Assets');
 $('kpi-bottleneck').innerHTML=bl.length?`<strong>Waiting on:</strong> ${bl.join(' & ')}`:`<strong>Blockers:</strong> None`;
 renderTable()}
function renderTable(){
 $('filter-bar').innerHTML='Filter:'+['All','Flagged','Blocked','On Pace','Done'].map(f=>`<button class="link-pill ${f===filter?'active':''}" onclick="filter='${f}';renderTable()">${f}</button>`).join('')+'<span style="margin-left:auto">8 of 60+ signed FIs in flight · Q2 · Alkami · Banno · Candescent · Lumin Digital</span>';
 const cls={Blocked:'badge-danger',Flagged:'badge-warn','On Pace':'badge-ok',Done:'badge-neutral'};
 $('table-body').innerHTML=fis.filter(r=>filter==='All'||r[6]===filter).map(r=>`<tr class="${r[6]==='Blocked'?'row-blocker':''}"><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td>Day ${r[3]} / 45</td><td>${r[4]}</td><td>${r[5]}</td><td><span class="badge ${cls[r[6]]}">${r[6]}</span></td></tr>`).join('')}
function switchView(v){$('board-grid').style.display=v==='board'?'grid':'none';$('table-view').style.display=v==='table'?'block':'none';$('btn-view-board').classList.toggle('active',v==='board');$('btn-view-table').classList.toggle('active',v==='table')}
function modal(title,sub,body,actions=''){$('modal-sheet').innerHTML=`<div class="modal-header"><div><div class="card-id-owner">${sub}</div><h2 class="modal-title">${title}</h2></div><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button>${actions}</div>`;$('modal-backdrop').classList.add('open')}
function closeModal(){$('modal-backdrop').classList.remove('open')}
function openCard(id){const c=cards.find(x=>x.id===id);
 modal(c.t,`${c.id} · ${stages[c.s].n}`,`<div class="kv"><b>Owner</b><span>${c.o}</span><b>Status</b><span>${badge(c)}</span><b>Window</b><span>${stages[c.s].d}</span><b>Detail</b><span>${c.n||'Completed and signed off by FI sponsor.'}</span><b>Next step</b><span>${c.st==='blocker'?'Escalate to Meridian CIO via sponsor pulse; offer 30-min scoped review with ScribeUp security lead.':c.st==='scope'?'Send pre-approved disclosure library; set 24h legal SLA.':'Track to target date.'}</span></div>`,c.st==='done'?'':`<button class="btn btn-primary" onclick="resolve('${c.id}')">Mark Resolved / Done</button>`)}
function resolve(id){
 cards.find(x=>x.id===id).st='done';
 const open=cards.filter(c=>c.st==='blocker'||c.st==='scope');
 if(!open.length){fis[0][4]='Staff pilot active -> Nov 18 rollout';fis[0][6]='On Pace';}
 else if(cards[6].st==='done'){fis[0][4]='Banner & push copy approval with FI legal';fis[0][6]='Flagged';}
 closeModal();render();toast(id+' marked done');
}
function openPulse(){const open=cards.filter(c=>c.st==='blocker'||c.st==='scope');
 modal('Weekly FI Sponsor Pulse','Friday · To: Meridian CU Executive Sponsor & Launch Team',`<div class="draft-box">Subject: Meridian × ScribeUp — Weekly Launch Pulse (Day 25)

Hi team,

Status: ${open.length?'AT RISK':'ON TRACK'} for Nov 18 go-live to 180k digital members.

Done: ${cards.filter(c=>c.st==='done').length}/${cards.length} milestones (core config, branding, UAT, Iris QA).
Pilot: Staff pilot active · 0 P1 bugs.

${open.length?'Needs you this week:\n'+open.map(c=>'• '+c.id+' '+c.t+' — '+c.n).join('\n'):'No open blockers.'}

Next: Nov 4 staff pilot cutoff → Nov 18 member rollout → Nov 25 Day-7 funnel review.

Thanks,
ScribeUp Launch Pod</div>`,`<button class="btn btn-primary" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.querySelector('.draft-box').innerText);toast('Pulse copied for email / Slack');closeModal()">Copy Pulse</button>`)}
function openAdd(){modal('Log Milestone','Add to Meridian launch',`<div class="form-grid"><div class="form-field"><label>Title</label><input id="nm-t" placeholder="e.g. Rate table refresh"></div><div class="form-field"><label>Stage</label><select id="nm-s">${stages.map((s,i)=>`<option value="${i}">${s.n}</option>`).join('')}</select></div></div>`,`<button class="btn btn-primary" onclick="addM()">Add</button>`)}
function addM(){const t=$('nm-t').value||'New milestone';cards.push({id:'L-'+(cards.length+1),s:+$('nm-s').value,st:'sched',b:'SCHEDULED',t,o:'ScribeUp CS'});closeModal();render();toast('Milestone logged')}
render();
</script>
</body></html>
