input[type="text"],input[type="search"],input[type="number"],select{background:#fff;border:2px solid #111;padding:8px 10px;width:100%;border-radius:0}
.err{color:#8f1d1d;font-weight:600;margin:0 0 8px}

.src{border-top:1px solid #111;padding:12px 0}

.cp{background:#fff;border:2px solid #1440ff;color:#1440ff;font:600 13px "IBM Plex Mono",ui-monospace,monospace;padding:6px 10px;cursor:pointer}
.cp:hover,.cp:focus-visible{background:#1440ff;color:#fff}
.brief h3{margin-top:16px;font-size:14px}
.hit{border-top:1px solid #111;padding:10px 0}
.meta,.muted,.idle{color:#333;font-size:13px}
.stale{border:2px solid #c4841d;background:#fff6e5;padding:8px 10px}
.check{border-bottom:1px solid #111;padding:12px 0}
.calc{margin-top:22px;border-top:3px solid #111;padding-top:8px}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin:12px 0}
.sliders label,.assumptions label{display:block;font-size:13px;font-weight:600}
input[type="range"]{width:100%;accent-color:#1440ff;margin-top:8px}
.assumptions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.roi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #111}
.roi div{padding:12px;border-right:1px solid #111}
.roi div:last-child{border-right:0}
.roi b{display:block;font-size:18px;margin-top:4px}
.formula{font-size:12px;line-height:1.5;color:#333;margin-top:10px}
.foot{margin-top:28px;border-top:3px solid #111;padding-top:16px;font-size:14px;line-height:1.5}
.foot a{color:#1440ff}
.empty{margin:8px 0 16px}
@media(max-width:980px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid #111}

  .kpi:nth-last-child(-n+2){border-bottom:0}
  .trow{grid-template-columns:1fr}
  .trow.head{display:none}
  .lbl{display:block}
  .pulse,.sliders,.assumptions,.roi{grid-template-columns:1fr}

  .roi div{border-right:0;border-bottom:1px solid #111}
  .roi div:last-child{border-bottom:0}
  .add{grid-template-columns:1fr}
  .phases{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .w{padding:20px 14px 56px}
  .kpis{grid-template-columns:1fr}
  .kpi{border-right:0!important;border-bottom:1px solid #111}
  .kpi:last-child{border-bottom:0}
  #q{max-width:none;margin-left:0}
  .card-top{flex-direction:column}
  h1{font-size:clamp(36px,12vw,56px)}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<script>
const TABS = [
  ["gate", "01 / 72h Intake Gate"],
  ["map", "02 / Exception & Handoff Map"],
  ["tracker", "03 / 30-Day Sprint Tracker & Drift Log"],
  ["pulse", "04 / Claude Code /sprint-pulse"],

];
const PHASES = [
  "Days 1–5 Discovery",
  "Days 6–12 Architecture & Prototype",
  "Days 13–22 Build & Shadow Run",
  "Days 23–30 Cutover & Handoff"
];
const PHASE_SHORT = ["Days 1–5", "Days 6–12", "Days 13–22", "Days 23–30"];
const LANES = [
  ["all", "All Steps"],
  ["ai", "AI Agent Owned"],
  ["human", "Human-in-the-Loop Gate"],
  ["unblock", "Needs Client Unblock"]
];
const PULSE_NOTE = "At Sophon Labs (~15-person remote team), I built a Claude Code bot that read Slack, Linear, and call transcripts every Wednesday and Friday, flagged anything stuck 7+ days, and killed round-robin status updates from Monday all-hands (~3 hrs/week saved). Here is that same workflow adapted for a 30-day client sprint (where 48 hours of silence = 2 weeks of normal project drift).";
const GATE_NOTE = "Why this gate exists: At Sophon Labs, I inherited a BaaS vendor signed before my time that couldn't actually support our target markets. Verifying vendor coverage and sandbox credentials in the first 72 hours prevents week-3 rewrites.";

const SCENARIOS = {
  field: {
    id: "field",
    button: "A · Field-Service WhatsApp Dispatch & Quoting Sprint (35-person A/C & Appliance Repair Co.)",
    kicker: "Sprint #04 — Informal A/C & Appliance Field-Service Dispatch & Quoting Automation",
    blurb: "A 35-person repair company. Customer requests arrive as messy WhatsApp messages, 40-second Spanish/English voice notes, and blurry unit model-plate photos with no address. Pricing lives in the lead technician's head while he's on a roof. Technicians leave job sites without logging parts used.",
    day: 9,
    when: "Wednesday",
    phase: "Phase 02: Workflow Decomposition & Build",
    noun: "request",
    formPhase: PHASES[1],
    slotLine: "Thursday's 15-min slot works if a reply is harder.",
    roi: { volume: 110, before: 18, after: 4, error: 15, reworkMin: 20, rate: 32, cost: 18000 },
    drift: {
      rowId: "r5",
      call: "if it's a normal diagnostic, don't wait on me. just send it.",
      written: "No customer-facing quote goes out until the approval cap is a written line the sponsor has agreed to. Auto-send is out of scope until then.",
      wont: "We will not wire auto-send. The agent can draft. A human still clicks.",
      closed: "The Thursday call asked for auto-send on a normal diagnostic. The cap is marked shipped, so this drift is closed. Auto-send only inside the written cap.",
      noteLine: "On Thursday's call the sponsor said a normal diagnostic can just be sent. Written scope still says no auto-send until the cap is signed, so we will draft and not send."
    },
    call: `Client Sponsor: if it's a normal diagnostic, don't wait on me. just send it.
Ops Lead: we still don't have a written cap. "normal" is whatever the lead tech remembers.
Client Dispatcher: this week half the requests were voice notes. i don't get an address until i call them back. and yesterday the tech swapped a dual capacitor and didn't tell anyone.
Field Tech Lead: i can't type prices on a roof. i'll do it this weekend.
Ops Lead: weekend misses the Friday pulse. i need the ranges tomorrow or the quote step stays a draft.`,
    slack: `Client Dispatcher [Mon 8:12]: still no WhatsApp Business admin. the number is a personal phone. IT said next week.
Client Dispatcher [Tue 18:41]: job closed. tech left. no part logged. pretty sure it was a dual capacitor.
Ops Lead [Tue 18:44]: don't guess it onto the invoice. i'm holding that job out of the ground-truth set until someone confirms the part.
Lead Engineer [Wed 9:02]: staging can transcribe the 18 notes we have. i am not wiring auto-send until the cap is written down.`,
    board: `GATE-03  Ground-truth 30          Blocked      18/30   sitting 3d   Ops Lead
QUOTE    Written approval cap      Blocked      —       sitting 2d   Client Sponsor
STEP-02  Price ranges              In progress  —       sitting 1d   Field Tech Lead
ENG-14   Staging transcription     In progress  18 notes            Lead Engineer`,
    slackPull: "Slack: a job closed with no part logged. Held out of the ground-truth set on purpose. Do not invoice a guessed capacitor.",
    gates: [
      { id: "g1", code: "GATE-01", name: "Executive Sponsor & Weekly 15-min Decision Slot", status: "PASS", owner: "Client Sponsor", sla: "Day 1 · 24h",
        need: "One named sponsor who can say yes or no, and a recurring 15-minute slot. Not a committee.",
        have: "Thursday 15-min is booked. The sponsor is the only person who can change quote policy.",
        miss: "Do not freeze scope from a group chat. If the slot slips, book the dispatcher before day 4 and keep the sponsor for decisions only.",
        action: "Put the 15-min slot back on the calendar today. Name the one person who can approve a quote rule.",
        slip: "Open questions wait a week and the build sits on policy." },
      { id: "g2", code: "GATE-02", name: "API/Admin/Sandbox Credentials & Market Coverage Check", status: "PASS", owner: "Ops Lead + Lead Engineer", sla: "Day 3 · 72h",
        need: "Sandbox credentials that actually receive a message, and a written check that we can reach customers on a business account. A personal SIM does not count.",
        have: "Sandbox webhook accepted a test voice note on day 2. Moving the real business number is a day-23 cutover, not a reason to skip the check.",
        miss: "If credentials are still with IT at 72 hours, the day-30 date moves one for one. A screenshot of a settings page is not a credential.",
        action: "Get a working sandbox key today, or a dated commit from IT. Confirm the customer-facing number is a business account.",
        slip: "Week 3 becomes a rewrite when the number cannot send templates.",
        note: GATE_NOTE },
      { id: "g3", code: "GATE-03", name: "Ground-Truth Data Sample of 30 Historical Runs", status: "BLOCKED", owner: "Ops Lead + Client Dispatcher", sla: "Day 3 · 72h",
        need: "30 real jobs, including voice-note only, a blurry model plate, no address, and a part that was never logged.",
        have: "18 jobs are in the sheet. The other 12 were closed in a voice note nobody transcribed, or the tech left without writing the part down.",
        miss: "Hard stop on the production build. Staging may transcribe the 18. Quote ranges do not ship off the clean 18 alone.",
        action: "Pull the 12 jobs with no closeout today, including any part that was swapped and never written down.",
        slip: "The quote model learns the tidy jobs and misses the first real blurry plate." },
      { id: "g4", code: "GATE-04", name: "Exception & Human-in-the-Loop Escalation Owner", status: "PASS", owner: "Client Dispatcher", sla: "Day 3 · 72h",
        need: "A named person for warranty, commercial multi-unit, and any quote off the table. Plus a backup if that person is on a route.",
        have: "Client Dispatcher is named. Field Tech Lead is the backup. Grey areas default to draft-and-hold.",
        miss: "If this is still 'the team' at 48 hours, every grey-area action stays a draft. Do not invent an approver.",
        action: "Name the person who clicks approve, and the backup. One line on the tracker.",
        slip: "The office will not adopt a tool that might text a customer or invoice a guessed part." },
      { id: "g5", code: "GATE-05", name: "Baseline Time/Cost Metric", status: "PASS", owner: "Ops Lead + Client Sponsor", sla: "Day 3 · 72h",
        need: "Three numbers the sponsor has agreed: touch time per request, time-to-quote, and how often a quote gets reworked.",
        have: "Signed day 3. Median first WhatsApp to a sent quote is 3.4 hours. Coordinator touch time is about 18 minutes. About 1 in 4 quotes is reworked because the model number was guessed.",
        miss: "Write the numbers down and get a one-line yes before build. Otherwise day 30 is a debate about whether it feels faster.",
        action: "Send the three baseline numbers and get a one-line yes from the Client Sponsor today.",
        slip: "Day-30 ROI has no starting line." }
    ],
    steps: [
      { id: "s1", code: "STEP-01", name: "Intake", lane: "ai",
        line: "40-second Spanish/English voice notes, blurry model plates, often no address.",
        claim: "The customer fills in a booking form with the address, the unit, and the problem.",
        actual: "They send a 40-second voice note in Spanish over a compressor, a photo of a model plate with the last digits blown out, or “¿puedes venir hoy?” and nothing else. Sometimes all three, out of order.",
        rule: "Transcribe Spanish and English. OCR the plate. Match the phone number to old jobs. If address or model confidence is under 0.8, leave it blank and ask. Never invent a model number.",
        human: "Client Dispatcher steps in for warranty, a commercial multi-unit, or a thread that has turned.",
        sla: "Draft the reply in under 5 minutes. If the webhook is quiet for 15 minutes, ping the dispatch channel.",
        fallback: "Coordinator uses the pinned two-question list. Unread threads older than 15 minutes get a loud ping.",
        source: "WhatsApp thread → intake sheet" },
      { id: "s2", code: "STEP-02", name: "Triage & quote", lane: "unblock",
        line: "The price list is the lead tech's memory, and he is usually on a roof.",
        claim: "The coordinator checks the price list and sends a quote.",
        actual: "There is no price list. The coordinator messages the Field Tech Lead and waits about three hours. A normal diagnostic goes cold while a capacitor price sits in someone's head.",
        rule: "Match unit family and symptom to the historical job table. Propose the diagnostic fee and a repair range. If the pair is not in the table, draft the quote and hold it. Do not send a number that is not written down.",
        human: "Client Dispatcher clicks send when the job is over the cap, off the table, or commercial. Under the cap, auto-send stays off until the sponsor writes the cap down.",
        sla: "Standard draft in 10 minutes. Human click the same day, before 4pm. No answer by then and the quote does not go out.",
        fallback: "A one-page diagnostic matrix pinned in the dispatch channel, so a standard job never waits on a roof.",
        source: "Historical job and pricing table" },
      { id: "s3", code: "STEP-03", name: "Dispatch", lane: "ai",
        line: "Routes change in the group chat. The missing part shows up in the driveway.",
        claim: "The job goes on the calendar and a tech is assigned.",
        actual: "The route changes in the group chat. Nobody checks parts until the tech is on site and needs a dual capacitor that is on another truck.",
        rule: "Build the job card before it leaves: pin, voice-note summary, plate photo, and the likely parts from the quote table. Prefer a route that already carries those parts.",
        human: "Client Dispatcher confirms the morning route before cards go out. After 7:30am, swaps are a human call.",
        sla: "Cards out by 7:30am. Same-day add-ons wait for the dispatcher.",
        fallback: "A static 7:30am text of the day's route to each tech.",
        source: "Dispatch board" },
      { id: "s4", code: "STEP-04", name: "Closeout", lane: "human",
        line: "Techs leave. The part they swapped never hits the invoice.",
        claim: "The tech marks the job complete and the office sends the invoice.",
        actual: "The tech leaves. The part is not logged. The office spends Friday reconstructing the week. A dual capacitor that was swapped never reaches the invoice, so nobody should guess it in.",
        rule: "When the tech leaves the site, ask for a 15-second voice note or a photo of the old part. Extract the part, the symptom, and the labor. Stage the invoice. Do not mark it paid. If the part was not on the card, flag it.",
        human: "Client Dispatcher checks the amount and releases the payment link. Field Tech Lead reviews any part that was not on the job card.",
        sla: "Prompt goes out as they leave. No note by 6pm and the job gets an end-of-day check-in. No human click, no invoice.",
        fallback: "A 6pm sweep of anything still marked on site.",
        source: "Job history and billing log" },
      { id: "s5", code: "STEP-05", name: "Learning loop", lane: "human",
        line: "Corrections die in the chat, so the same wrong price comes back tomorrow.",
        claim: "If the system is wrong, someone complains and it gets fixed.",
        actual: "The dispatcher edits a drafted quote inside the thread. The correction dies there. Tomorrow the same unit family is priced off a guess.",
        rule: "Every edit and every rejected quote writes one row: what the agent proposed, what the human sent, the part, the unit family. No row, no learning.",
        human: "Ops Lead and the Client Dispatcher spend 15 minutes on Friday moving repeated corrections into the plain-text rules file.",
        sla: "The row is written the same day. The rules file is updated Friday, or the correction does not count as learned.",
        fallback: "processes/dispatch-rules.md stays a plain file the company owns. It is not trapped in a prompt.",
        source: "processes/dispatch-rules.md" }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  if (risk) return { kind: "risk", text: "BUILD OPEN WITH WATCH ITEMS: " + risk + " Gate" + (risk === 1 ? "" : "s") + " At Risk" };

}

  const risk = state.gates.filter(g => g.status === "AT RISK").length;

function copyText(text, btn) {

  const done = () => {

    setTimeout(() => { if (btn.isConnected) btn.textContent = label; }, 1400);
  };
  const fallback = () => {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); } catch (e) {}
    area.remove();
    done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();

      const on = state.tab === t[0];
      return '<button type="button" role="tab" id="tab-' + t[0] + '" aria-selected="' + on + '" aria-controls="panel" data-act="tab" data-id="' + t[0] + '">' + esc(t[1]) + "</button>";
    }).join("") + '</div><input id="q" type="search" value="' + esc(state.search) + '" placeholder="Filter this tab" autocomplete="off" aria-label="Filter this tab"></div></header>';
}
function kpi(id, k, v, tab, sub) {
  return '<button type="button" class="kpi" data-act="jump" data-id="' + tab + '"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + "</span>" +
    (sub ? '<span class="s">' + esc(sub) + "</span>" : "") + "</button>";
}
function panel() {
  const tab = state.tab;
  let body = "";
  if (tab === "gate") body = gatePanel();
  else if (tab === "map") body = mapPanel();
  else if (tab === "tracker") body = trackerPanel();
  else if (tab === "pulse") body = pulsePanel();
  else body = handoffPanel();
  const label = (TABS.find(t => t[0] === tab) || TABS[0])[1];
  return '<main id="panel" role="tabpanel" aria-labelledby="tab-' + tab + '" tabindex="-1">' + body + "</main>";
}
function gatePanel() {
  const b = banner();
  return "<h2>01 / 72h Intake Gate</h2><p class=\"lede\">Pre-sprint access, data, and sponsor lock. Five gates between day 1 and day 3. One blocked gate stops the production build. Click a status to cycle PASS, AT RISK, and BLOCKED.</p>" +
    '<p class="hint">' + esc(b.text) + "</p>" +
    state.gates.map(gateCard).join("") +
    '<p id="empty" class="empty" hidden>Nothing matches that filter.</p>';
}
function mapPanel() {
  const steps = state.steps.filter(s => state.filterLane === "all" || s.lane === state.filterLane);
  const counts = {};
  state.steps.forEach(s => { counts[s.lane] = (counts[s.lane] || 0) + 1; });
  const items = LANES.map(l => [l[0], l[1], l[0] === "all" ? state.steps.length : (counts[l[0]] || 0)]);
  return "<h2>02 / Exception & Handoff Map</h2><p class=\"lede\">Happy path vs. the real mess. Open a step for what the client claims, what actually happens, the rule, the human fallback, and the SLA.</p>" +
    pills(items, state.filterLane, "lane") +
    (steps.length ? steps.map(stepCard).join("") : '<p class="empty">Nothing in this slice.</p>') +
    '<p id="empty" class="empty" hidden>Nothing matches that filter.</p>';
}
function trackerPanel() {
  const phaseIndex = current().day <= 5 ? 0 : current().day <= 12 ? 1 : current().day <= 22 ? 2 : 3;
  const phased = state.rows.filter(r => state.filterPhase === "all" || r.phase === state.filterPhase);
  const countStatus = id => phased.filter(r => {
    if (id === "Blocked >48h") return isStall(r);
    if (id === "In Progress") return r.status === "In Progress" && r.days < 2;
    return r.status === id;
  }).length;
  const phaseItems = [["all", "All Phases", state.rows.length]].concat(PHASES.map(p => [p, p, state.rows.filter(r => r.phase === p).length]));
  const statusItems = [["all", "All Statuses", phased.length]].concat(["Shipped", "In Progress", "Blocked >48h", "Upcoming"].map(s => [s, s, countStatus(s)]));
  const rows = state.rows.filter(rowVisible);
  const warnings = gateWarnings();
  const timeline = PHASE_SHORT.map((label, i) => '<li class="' + (i < phaseIndex ? "done" : i === phaseIndex ? "now" : "") + '">' + esc(label) + (i === phaseIndex ? " · now" : "") + "</li>").join("");
  return "<h2>03 / 30-Day Sprint Tracker & Drift Log</h2><p class=\"lede\">Days 1–30. A 48-hour stall here is about two weeks of drift on a normal project. Red rows are blocked. Amber rows are in progress and already past 48h. Both need a 24-hour action.</p>" +
    '<ol class="phases">' + timeline + "</ol>" +
    pills(phaseItems, state.filterPhase, "phase") +
    pills(statusItems, state.filterStatus, "status-filter") +
    (warnings.length ? '<div class="warn"><b>Gate and tracker disagree.</b><ul>' + warnings.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul></div>" : "") +
    '<div class="add"><input type="text" data-form="title" value="' + esc(state.form.title) + '" placeholder="New stall, in one line" aria-label="New stall" autocomplete="off">' +
    '<select data-form="phase" aria-label="Phase">' + PHASES.map(p => '<option' + (p === state.form.phase ? " selected" : "") + ">" + esc(p) + "</option>").join("") + "</select>" +
    '<input type="text" data-form="owner" list="owners" value="' + esc(state.form.owner) + '" aria-label="Owner" autocomplete="off">' +
    '<input type="text" data-form="action" value="' + esc(state.form.action) + '" placeholder="24-hour unblock action" aria-label="24-hour unblock action" autocomplete="off">' +
    '<button type="button" class="texty" data-act="add">Add blocker</button></div>' +
    '<datalist id="owners"><option value="Ops Lead"><option value="Lead Engineer"><option value="Client Sponsor"><option value="Client Dispatcher"><option value="Field Tech Lead"><option value="Client Compliance"></datalist>' +
    (state.formError ? '<p class="err" id="form-error">' + esc(state.formError) + "</p>" : "") +
    '<div class="trow head"><div>Window</div><div>Milestone</div><div>Owner</div><div>Status</div><div>Days sitting</div><div>24-Hour Unblock</div></div>' +
    (rows.length ? rows.map(trackerRow).join("") : '<p class="empty">Nothing in this slice.</p>') +
    '<p id="empty" class="empty" hidden>Nothing matches that filter.</p>';
}
function pulsePanel() {
  const sc = current();
  const running = state.pulse && state.pulse.phase === "running";
  return "<h2>04 / Claude Code /sprint-pulse</h2><p class=\"lede\">" + esc(PULSE_NOTE) + "</p>" +
    '<p class="hint">This run is Day ' + sc.day + " " + esc(sc.when) + ". Turn a source off and run again. The brief follows the toggles and the live tracker.</p>" +
    '<div class="pulse"><div class="sources">' +
    sourceBlock("call", "Call Transcripts", sc.call) +
    sourceBlock("slack", "Client Slack Channel", sc.slack) +
    sourceBlock("board", "Task Board", sc.board) +
    '<div class="src"><div class="card-top"><button type="button" class="chip' + (state.sources.prompt ? " on" : "") + '" data-act="source" data-id="prompt" aria-pressed="' + state.sources.prompt + '">Slash-command prompt</button>' +
    '<button type="button" class="cp" data-act="copy" data-id="prompt" data-label="Copy Prompt">Copy Prompt</button></div>' +
    (state.sources.prompt ? '<pre class="snippet">' + esc(buildPrompt()) + "</pre>" : "") +
    "</div></div><div class=\"out\">" +
    '<button type="button" class="cta" data-act="run"' + (running ? " disabled" : "") + ">Run /sprint-pulse (Day " + sc.day + " " + esc(sc.when) + ")</button>" +
    '<pre class="term" id="term">' + esc(termText()) + "</pre>" +
    briefHTML() + "</div></div>";
}
function handoffPanel() {
  const ready = readiness();
  return "<h2>05 / Day-30 Handoff & ROI Sign-Off</h2><p class=\"lede\">Go-live and whether the client can run it without us. Click a status to cycle OPEN, IN PROGRESS, and SIGNED. Readiness counts signed items only. " + ready.n + " / " + ready.total + " signed · " + ready.pct + "%.</p>" +
    state.handoff.map(h => '<article class="check" data-hay="' + hay(h.name, h.status, h.owner, h.detail) + '"><div class="card-top"><div><h3>' + esc(h.name) + '</h3><p class="code">' + esc(h.owner) + "</p></div>" +
      '<button type="button" class="st ' + statusClass(h.status) + '" role="checkbox" aria-checked="' + (h.status === "SIGNED" ? "true" : h.status === "IN PROGRESS" ? "mixed" : "false") + '" data-act="handoff" data-id="' + esc(h.id) + '">' + esc(h.status) + "</button></div><p class=\"line\">" + esc(h.detail) + "</p></article>").join("") +
    '<p id="empty" class="empty" hidden>Nothing matches that filter.</p>' + roiHTML();
}
function foot() {
  return '<footer class="foot"><p>Sample operating picture, built from real work: field-service dispatch, and a BaaS vendor that did not cover the markets. Role titles only.</p><p><a href="../index.html">← ops portfolio</a> · <a href="https://x.com/n_andrea_q" rel="noopener">@n_andrea_q</a></p></footer>';
}
function view() {
  return '<div class="w">' + head() + panel() + foot() + "</div>";
}
function applySearch() {
  const q = state.search.trim().toLowerCase();
  const nodes = Array.from(document.querySelectorAll("[data-hay]"));
  let shown = 0;
  nodes.forEach(el => {
    const ok = !q || (el.dataset.hay || "").indexOf(q) !== -1;
    el.hidden = !ok;
    if (ok) shown += 1;
  });
  const empty = document.getElementById("empty");
  if (!empty || !nodes.length) return;
  empty.hidden = shown !== 0;
}
function render() {
  const prev = document.activeElement;
  const keep = prev && prev.dataset && (prev.dataset.act || prev.id === "q");
  const snap = keep ? { act: prev.dataset.act || "", id: prev.dataset.id || "", dir: prev.dataset.dir || "", htmlId: prev.id || "" } : null;
  document.getElementById("root").innerHTML = view();
  applySearch();
  const live = document.getElementById("live");
  if (live) {
    const ready = readiness();
    live.textContent = banner().text + ". " + driftText() + ". Go-live " + ready.pct + " percent.";
  }
  if (!snap) return;
  let next = null;
  if (snap.htmlId && snap.htmlId !== "q") next = document.getElementById(snap.htmlId);
  if (!next && snap.act) {
    let sel = '[data-act="' + cssAttr(snap.act) + '"]';
    if (snap.id) sel += '[data-id="' + cssAttr(snap.id) + '"]';
    if (snap.dir) sel += '[data-dir="' + cssAttr(snap.dir) + '"]';
    next = document.querySelector(sel);
  }
  if (snap.htmlId === "q") next = document.getElementById("q");
  if (next && typeof next.focus === "function") next.focus({ preventScroll: true });
}
function paintRoi() {
  const box = document.getElementById("roi-out");
  if (box) box.innerHTML = roiOutHTML(roiResult());
}
function onClick(e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  if (act === "tab" || act === "jump") {
    scrollTab = true;
    if (location.hash !== "#" + id) location.hash = id;
    else { state.tab = id; render(); revealTab(); }
    return;
  }
  if (act === "scenario") { setScenario(id); return; }
  if (act === "reset") { resetScenario(); return; }
  if (act === "gate") { cycleGate(id); return; }
  if (act === "lane") { state.filterLane = id; render(); return; }
  if (act === "phase") { state.filterPhase = id; render(); return; }
  if (act === "status-filter") { state.filterStatus = id; render(); return; }
  if (act === "step") { state.open[id] = !state.open[id]; render(); return; }
  if (act === "status") { cycleStatus(id); return; }
  if (act === "day") { bumpDay(id, Number(t.dataset.dir)); return; }
  if (act === "add") { addBlocker(); return; }
  if (act === "remove") { removeRow(id); return; }
  if (act === "handoff") { cycleHandoff(id); return; }
  if (act === "source") {
    state.sources[id] = !state.sources[id];
    if (id !== "prompt") markStale();
    render();
    return;
  }
  if (act === "run") { runPulse(); return; }
  if (act === "copy") {
    const text = id === "prompt" ? buildPrompt() : (state.pulse && state.pulse.result ? state.pulse.result.note : buildClientNote(state.sources));
    copyText(text, t);
  }
}
function onInput(e) {
  const t = e.target;
  if (t.id === "q") {
    state.search = t.value;
    applySearch();
    return;
  }
  if (t.dataset && t.dataset.roi) {
    state.roi[t.dataset.roi] = Number(t.value);
    const out = document.querySelector('[data-roi-out="' + t.dataset.roi + '"]');
    if (out) out.textContent = String(state.roi[t.dataset.roi]);
    paintRoi();
    return;
  }
  if (t.dataset && t.dataset.form) {
    state.form[t.dataset.form] = t.value;
    if (state.formError) {
      state.formError = "";
      const err = document.getElementById("form-error");
      if (err) err.hidden = true;
    }
  }
}
function onKey(e) {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.form) {
    e.preventDefault();
    addBlocker();
  }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && e.target.closest("[role=tablist]")) {
    const ids = TABS.map(t => t[0]);
    let i = ids.indexOf(state.tab);
    if (i < 0) i = 0;
    const n = e.key === "ArrowRight" ? (i + 1) % ids.length : (i - 1 + ids.length) % ids.length;
    e.preventDefault();
    location.hash = ids[n];
  }
}
document.addEventListener("click", onClick);
document.addEventListener("input", onInput);
document.addEventListener("change", onInput);
document.addEventListener("keydown", onKey);
window.addEventListener("hashchange", () => {
  state.tab = tabFromHash();
  render();
  revealTab();
});
function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get("scenario") === "fintech" ? "fintech" : "field";
  loadScenario(id);
  state.tab = tabFromHash();
  render();
}
init();
</script>
</body>
</html>
