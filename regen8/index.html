:root{
  --paper:#FAF6EC;
  --bone:#F2ECDE;
  --ink:#121212;
  --ember:#FF3B18;
  --white:#fff;
  --muted:rgba(18,18,18,.58);
  --faint:rgba(18,18,18,.42);
  --line:rgba(18,18,18,.08);
  --font-display:"Srotone",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Salena",ui-sans-serif,system-ui,sans-serif;
  --font-label:"Pixotype",ui-sans-serif,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.45 var(--font-body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;background:var(--ink);color:var(--paper);padding:8px 12px;z-index:50;text-decoration:none}
.skip:focus{left:12px;top:12px}

.wrap{max-width:1440px;margin:0 auto;padding:32px 32px 64px}

.top{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-bottom:28px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.logo{font-family:var(--font-display);font-weight:500;font-size:26px;letter-spacing:-.03em;line-height:1}
.by{font-size:13px;color:var(--muted);background:var(--white);border-radius:999px;padding:5px 12px;box-shadow:0 1px 2px rgba(18,18,18,.04)}
.controls{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}

.pick{position:relative}
.pick summary,.ghost,.run{
  list-style:none;border:0;border-radius:999px;background:var(--white);
  box-shadow:0 1px 2px rgba(18,18,18,.05);padding:8px 14px;font-size:13.5px;color:var(--ink)
}
.pick summary{cursor:pointer}
.pick summary::-webkit-details-marker{display:none}
.pick summary:after{content:"▾";margin-left:8px;color:var(--faint);font-size:11px}
.menu{
  position:absolute;right:0;top:calc(100% + 8px);z-index:6;background:var(--white);
  border-radius:14px;padding:6px;min-width:100%;
  box-shadow:0 12px 40px rgba(18,18,18,.12)
}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-size:13.5px}
.menu button:hover,.menu button.on{background:var(--bone)}

.filters{display:flex;gap:4px;align-items:center}
.filters button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.filters button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(18,18,18,.05)}
.filters .n{color:var(--ember)}
.run{background:var(--ink);color:var(--paper);padding:9px 16px;box-shadow:none}
.run:hover{background:#2a2a2a}

.strip{display:flex;flex-wrap:wrap;align-items:center;gap:14px 32px;margin:0 0 28px;font-size:14.5px;color:var(--ink)}
.strip .muted{color:var(--muted)}
.meter{display:inline-block;width:128px;height:3px;background:rgba(18,18,18,.12);border-radius:99px;margin-left:12px;vertical-align:middle;overflow:hidden}
.meter span{display:block;height:100%;background:var(--ink)}
.texty{border:0;background:none;padding:0;font-size:14.5px;color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(18,18,18,.3)}
.texty.hot{color:var(--ember);text-decoration-color:rgba(255,59,24,.4)}
.texty.quiet{color:var(--muted);text-decoration:none}
.texty.quiet:hover{color:var(--ink)}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;align-items:stretch}
.col{background:var(--bone);border-radius:18px;padding:16px 12px 20px;min-height:520px}
.col.over{background:#E7E0D0}
.col-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 8px 14px}
.col h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:16px;letter-spacing:-.02em;line-height:1.25}
.col.slip{box-shadow:inset 0 3px 0 var(--ember)}
.col.slip h2{color:var(--ember)}
.cnt{font-family:var(--font-mono);font-size:12px;color:var(--faint)}
.cards{display:flex;flex-direction:column;gap:12px;min-height:48px}
.empty{margin:8px;color:var(--faint);font-size:13px}

.card{
  background:var(--white);border-radius:14px;padding:16px 16px 14px;
  box-shadow:0 1px 2px rgba(18,18,18,.04),0 10px 28px rgba(18,18,18,.04);
  cursor:grab
}
.card:active{cursor:grabbing}
.card.dragging{opacity:.45}
.card.flagged{background:#FFF8F6}
.micro{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.phase{font-family:var(--font-label);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.age{font-family:var(--font-label);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.age.bad{color:var(--ember);background:rgba(255,59,24,.1);border-radius:999px;padding:3px 8px}
.card h3{margin:0;font-size:15.5px;font-weight:500;letter-spacing:-.01em;line-height:1.35}
.callout{margin:12px 0 0;background:#FFF1EC;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.owner{font-size:12px;color:var(--muted);background:var(--bone);border-radius:999px;padding:4px 8px}
.move{position:relative}
.move summary{list-style:none;font-size:12px;color:var(--faint);cursor:pointer;padding:4px 2px}
.move summary::-webkit-details-marker{display:none}
.move summary:hover{color:var(--ink)}
.move .menu{min-width:180px;right:0}
.move .menu button{font-size:13px}

.backdrop{position:fixed;inset:0;background:rgba(18,18,18,.28);z-index:20}
.sheet{
  position:fixed;z-index:21;background:var(--white);box-shadow:0 24px 80px rgba(18,18,18,.16)
}
.modal{
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(680px,calc(100vw - 48px));max-height:min(760px,calc(100vh - 64px));
  overflow:auto;border-radius:18px;padding:28px 32px 32px
}
.drawer{top:0;right:0;bottom:0;width:min(440px,100vw);overflow:auto;padding:32px 32px 48px}
.sheet h2{font-family:var(--font-display);font-weight:500;font-size:26px;letter-spacing:-.03em;margin:0 0 8px;line-height:1.15}
.sheet .lead{color:var(--muted);margin:0 0 22px;font-size:14.5px}
.x{position:absolute;top:18px;right:18px;border:0;background:transparent;font-size:20px;line-height:1;color:var(--faint);padding:6px}
.x:hover{color:var(--ink)}
.kicker{font-family:var(--font-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.block{margin:0 0 22px}
.block h3{margin:0 0 6px;font-size:15px;font-weight:500}
.block p{margin:0;color:var(--muted);font-size:14.5px}
.grow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.grow h3{margin:0 0 4px;font-size:16px;font-weight:500}
.grow p{margin:0;color:var(--muted);font-size:14px}
.tag{border:0;background:var(--bone);border-radius:999px;padding:6px 10px;font-size:12px;letter-spacing:.03em;text-transform:uppercase;font-family:var(--font-label)}
.tag.bad{background:rgba(255,59,24,.1);color:var(--ember)}
.note{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.checks button{border:0;background:var(--bone);border-radius:999px;padding:6px 10px;font-size:13px;color:var(--muted)}
.checks button.on{background:var(--ink);color:var(--paper)}
.cta{display:block;width:100%;border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 22px}
.out{margin:0 0 26px}
.out h3{margin:0 0 8px;font-size:16px;font-weight:500}
.out p,.out li{font-size:14.5px;color:var(--muted)}
.out ul{margin:0;padding-left:18px}
.hit{margin:0 0 12px}
.hit b{color:var(--ink);font-weight:500}
.note-box{white-space:pre-wrap;font-family:var(--font-body);font-size:14.5px;line-height:1.45;background:var(--paper);border-radius:12px;padding:14px;margin:0 0 10px;color:var(--ink)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.rowbtns button,.cp{border:0;background:var(--bone);border-radius:999px;padding:8px 12px;font-size:13px}
.term{font-family:var(--font-mono);font-size:12px;color:var(--faint);white-space:pre-wrap;margin:0 0 16px}
.term:empty{display:none}
.sliders{display:grid;gap:14px;margin-top:8px}
.sliders label{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px;color:var(--muted)}
.sliders input{grid-column:1/-1;width:100%;accent-color:var(--ink)}
.big{font-family:var(--font-mono);font-size:28px;letter-spacing:-.03em;margin:0}
.check{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.check h3{margin:0 0 4px;font-size:15px;font-weight:500}
.check p{margin:0;color:var(--muted);font-size:13.5px}
.step{padding:16px 0;border-top:1px solid var(--line)}
.step h3{margin:0 0 8px;font-size:16px}
.step p{margin:0 0 6px;color:var(--muted);font-size:14px}
.step b{color:var(--ink);font-weight:500}

@media(max-width:1100px){
  .board{grid-template-columns:1fr 1fr}
  .top{align-items:flex-start;flex-direction:column}
  .controls{justify-content:flex-start}
}
@media(max-width:720px){
  .wrap{padding:20px 16px 40px}
  .board{grid-template-columns:1fr}
  .col{min-height:0}
  .filters{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

  render();
  const term = document.getElementById("term");

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step = () => {

    state.pulse.shown += 1;
    const pre = document.getElementById("term");
    if (pre) pre.textContent = state.pulse.lines.slice(0, state.pulse.shown).join("\n");
    if (state.pulse.shown < state.pulse.lines.length) setTimeout(step, reduce ? 0 : 80);
    else {

function copyText(text, btn) {
  const label = btn.dataset.label || btn.textContent;
  const done = () => {
    btn.textContent = "Copied";
    setTimeout(() => { if (btn.isConnected) btn.textContent = label; }, 1400);
  };
  const fallback = () => {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); } catch (e) {}
    area.remove();
    done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function onClick(e) {
  if (suppressClick) return;

    const act = t.dataset.act;
    const id = t.dataset.id;
    if (act === "close") { closeSheet(); return; }
    if (act === "scenario") { setScenario(id); return; }
    if (act === "filter") { state.filter = id; render(); return; }
    if (act === "watch") { state.filter = state.filter === "slip" ? "all" : "slip"; render(); return; }
    if (act === "gates") { openHash("#gate"); return; }
    if (act === "roi") { openHash("#handoff"); return; }

      if (location.hash !== "#pulse") location.hash = "#pulse";
      runPulse();
      return;
    }
    if (act === "gate") { cycleGate(id); return; }
    if (act === "handoff") { cycleHandoff(id); return; }
    if (act === "moveto") { moveTo(id, t.dataset.to); return; }
    if (act === "source") { state.sources[id] = !state.sources[id]; markStale(); render(); return; }
    if (act === "flag") {
      state.flagged = {};
      decisionItems().forEach(item => {
        const row = state.rows.find(r => r.code === item.code);
        if (row) state.flagged[row.id] = true;

    }
    if (act === "copy") {
      const text = state.pulse && state.pulse.result ? state.pulse.result.note : buildClientNote(state.sources);
      copyText(text, t);
      return;
    }
    if (act === "copyping") {
      const area = document.getElementById("ping");
      if (area) copyText(area.value, t);
      return;
    }
    return;
  }
  const card = e.target.closest("[data-card]");
  if (card && !e.target.closest("summary, button, a, details")) {
    state.sheet = "card";
    state.cardId = card.dataset.card;
    render();
  }
}
function onInput(e) {
  const t = e.target;
  if (t.dataset && t.dataset.roi) {
    state.roi[t.dataset.roi] = Number(t.value);
    const out = document.querySelector('[data-roi-out="' + t.dataset.roi + '"]');
    if (out) out.textContent = String(state.roi[t.dataset.roi]);
    paintRoi();
  }
}
document.addEventListener("click", onClick);
document.addEventListener("input", onInput);
document.addEventListener("change", onInput);
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) closeSheet(); });
document.addEventListener("dragstart", e => {
  const card = e.target.closest && e.target.closest("[data-card]");
  if (!card) return;
  e.dataTransfer.setData("text/plain", card.dataset.card);
  e.dataTransfer.effectAllowed = "move";
  card.classList.add("dragging");
  suppressClick = true;
});
document.addEventListener("dragend", () => {
  document.querySelectorAll(".dragging, .col.over").forEach(el => el.classList.remove("dragging", "over"));
  setTimeout(() => { suppressClick = false; }, 80);
});
document.addEventListener("dragover", e => {
  const col = e.target.closest && e.target.closest("[data-col]");
  document.querySelectorAll(".col.over").forEach(el => { if (el !== col) el.classList.remove("over"); });
  if (!col) return;
  e.preventDefault();
  col.classList.add("over");
});
document.addEventListener("drop", e => {
  const col = e.target.closest && e.target.closest("[data-col]");
  document.querySelectorAll(".col.over").forEach(el => el.classList.remove("over"));
  if (!col) return;
  e.preventDefault();
  moveTo(e.dataTransfer.getData("text/plain"), col.dataset.col);
});
window.addEventListener("hashchange", () => { syncSheetFromHash(); render(); });
function setScenario(id) {
  if (!SCENARIOS[id] || id === state.scenarioId) return;
  loadScenario(id);
  state.filter = "all";
  state.sheet = null;
  state.cardId = null;
  state.flagged = {};
  const url = new URL(location.href);
  if (id === "field") url.searchParams.delete("scenario");
  else url.searchParams.set("scenario", "fintech");
  if (location.hash && location.hash !== "#tracker") url.hash = location.hash;
  history.replaceState(null, "", url);
  syncSheetFromHash();
  render();
}
function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get("scenario") === "fintech" ? "fintech" : "field";
  loadScenario(id);
  state.filter = "all";
  state.sheet = null;
  state.cardId = null;
  state.flagged = {};
  syncSheetFromHash();
  render();
  if (location.hash === "#pulse") runPulse();
}
init();
</script>
</body>
</html>
