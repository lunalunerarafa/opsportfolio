name: reboot pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - README.md
      - .nojekyll
      - .github/workflows/reboot-pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
jobs:
  reboot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          http() {
            label="$1"
            shift
            out=$(gh api -i "$@" 2>&1)
            code=$(printf '%s\n' "$out" | awk '/^HTTP/{print $2; exit}')
            echo "HTTP ${label} ${code:-NO_HTTP}"
          }
          shas="${SHA} 101203e9cfbcd731df768d5dba44367f660398f4 ea7cec288d94fab007467e289a6ff2eab86e2465"
          extra=$(gh api "repos/${REPO}/deployments?per_page=20" --jq '.[] | select(.environment=="github-pages") | .sha')
          shas="$shas $extra"
          seen=""
          for sha in $shas; do
            case " $seen " in
              *" $sha "*) continue ;;
            esac
            seen="$seen $sha"
            http "CANCEL sha ${sha}" -X POST "repos/${REPO}/pages/deployments/${sha}/cancel"
          done
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html README.md .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
